url: https://sounkou-bioinfo.github.io/pi-ducknng/
destination: docs

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: '#17675c'
    link-color: '#17675c'
  includes:
    in_header: |
      <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs';
        const nodes = [...document.querySelectorAll('pre.mermaid, pre:has(> code.language-mermaid)')];
        for (const node of nodes) {
          node.textContent = node.textContent;
          node.classList.add('mermaid');
        }
        mermaid.initialize({startOnLoad: false, securityLevel: 'strict', theme: 'neutral'});
        await mermaid.run({nodes});
      </script>

development:
  mode: unreleased

home:
  title: Data work that lasts, for Pi agents
  description: Give Pi agents a DuckDB workspace that outlives the conversation, a persistent R session behind it, and a durable mailbox for handing each other work, all over ducknng.

navbar:
  structure:
    left: [intro, articles, thesis]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/agent-product-path.html
    thesis:
      text: Thesis
      href: https://github.com/sounkou-bioinfo/pi-ducknng/blob/main/THESIS.md

