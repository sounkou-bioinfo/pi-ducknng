    {
      "name": "ducknng_set_service_limits",
      "kind": "scalar",
      "category": "Transport Security",
      "signature": "ducknng_set_service_limits(name, max_open_sessions[, max_active_pipes[, max_inflight_requests[, max_sessions_per_peer_identity[, max_inflight_per_principal[, max_reply_bytes_per_principal[, max_session_open_rate_per_principal]]]]]])",
      "returns": "BOOLEAN",
      "since": "0.1.0",
      "implemented": true,
      "description": "Set service resource limits.",
      "notes": [
        "max_open_sessions limits concurrently open query sessions for the service; 0 means unlimited.",
        "When the limit is exceeded, query_open fails with ducknng: max open sessions exceeded.",
        "max_active_pipes limits simultaneously active NNG protocol-socket pipes for the service; 0 means unlimited.",
        "The two-argument form preserves the current max_active_pipes value.",
        "max_inflight_requests limits concurrent requests inside the service request boundary; 0 means unlimited.",
        "The three-argument form preserves the current max_inflight_requests value.",
        "max_sessions_per_peer_identity limits concurrently open query sessions for each verified TLS peer identity; 0 means unlimited.",
        "The four-argument form preserves the current max_sessions_per_peer_identity value.",
        "max_inflight_per_principal limits concurrent in-flight requests for each verified TLS peer identity; 0 means unlimited. Exceeded requests fail with ducknng: max inflight requests per principal exceeded.",
        "max_reply_bytes_per_principal is a cumulative reply byte budget per principal since service start; 0 means unlimited. Exceeded requests fail with ducknng: reply byte quota for principal exceeded.",
        "max_session_open_rate_per_principal is a cumulative session-open count cap per principal since service start; 0 means unlimited. Exceeded requests fail with ducknng: session open rate per principal exceeded.",
        "Per-principal limits require a verified TLS peer identity; they have no effect when TLS authentication is not active."
      ],
      "examples": [
        "SELECT ducknng_set_service_limits('svc', 16::UBIGINT);",
        "SELECT ducknng_set_service_limits('svc', 16::UBIGINT, 128::UBIGINT);",
        "SELECT ducknng_set_service_limits('svc', 16::UBIGINT, 128::UBIGINT, 8::UBIGINT);",
        "SELECT ducknng_set_service_limits('svc', 16::UBIGINT, 128::UBIGINT, 8::UBIGINT, 2::UBIGINT);",
        "SELECT ducknng_set_service_limits('svc', 16::UBIGINT, 128::UBIGINT, 8::UBIGINT, 2::UBIGINT, 4::UBIGINT);",
        "SELECT ducknng_set_service_limits('svc', 16::UBIGINT, 128::UBIGINT, 8::UBIGINT, 2::UBIGINT, 4::UBIGINT, 1048576::UBIGINT);",
        "SELECT ducknng_set_service_limits('svc', 16::UBIGINT, 128::UBIGINT, 8::UBIGINT, 2::UBIGINT, 4::UBIGINT, 1048576::UBIGINT, 10::UBIGINT);"
      ],
      "parameters": "name, max_open_sessions[, max_active_pipes[, max_inflight_requests[, max_sessions_per_peer_identity[, max_inflight_per_principal[, max_reply_bytes_per_principal[, max_session_open_rate_per_principal]]]]]]"
    },
    {
      "name": "ducknng_service_inflight",
      "kind": "scalar",
      "category": "Service Control",
      "signature": "ducknng_service_inflight(name)",
      "returns": "UBIGINT",
      "since": "0.1.0",
      "implemented": true,
      "description": "Return the current in-flight request count for a named service. Re-evaluated on every call, making it suitable for use inside recursive poll CTEs.",
      "notes": [
        "Returns 0 if the service is not found or no requests are currently in flight.",
        "Unlike ducknng_list_servers(), this scalar is re-evaluated per row and per CTE iteration, so it reflects live state rather than a query-start snapshot."
      ],
      "examples": [
        "SELECT ducknng_service_inflight('my_svc');",
        "WITH RECURSIVE poll(i, c) AS (SELECT 1, ducknng_service_inflight('my_svc') UNION ALL SELECT i + 1, (COALESCE(CASE WHEN c < 1 THEN sleep_ms(10) ELSE 0 END, 0) * 0 + ducknng_service_inflight('my_svc')) FROM poll WHERE c < 1 AND i < 500) SELECT c FROM poll ORDER BY i DESC LIMIT 1;"
      ]
    },
    {
      "name": "ducknng_set_service_execution_model",
      "kind": "scalar",
      "category": "Service Control",
      "signature": "ducknng_set_service_execution_model(name, model)",
      "returns": "BOOLEAN",
      "since": "0.1.0",
      "implemented": true,
      "description": "Set the DuckDB connection execution model used by service-side SQL.",
      "notes": [
        "Accepted models are shared_serialized_connection, service_serialized_connection, and request_connection; short aliases shared, service, and request are also accepted.",
        "shared_serialized_connection is the backward-compatible default and uses the runtime init connection behind one shared mutex.",
        "service_serialized_connection opens one DuckDB connection for the service and serializes that service's SQL on a service-local execution mutex.",
        "request_connection borrows one pre-opened DuckDB execution-pool connection for each service-side SQL execution and returns it after the handler finishes.",
        "Execution-pool connections are opened from the same DuckDB database handle at extension initialization; they share the catalog but do not inherit temp tables, temp macros, or other connection-local state from the init connection.",
        "The execution model cannot be changed while the service has active requests or open query sessions. Set it immediately after starting the service and before exposing it to traffic."
      ],
      "examples": [
        "SELECT ducknng_set_service_execution_model('svc', 'service_serialized_connection');",
        "SELECT ducknng_set_service_execution_model('svc', 'request_connection');"
      ],
      "parameters": "name, model"
    },
