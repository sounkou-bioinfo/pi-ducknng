        "Profile scope enforcement is fail-closed before sending: scheme, host, optional port, path prefix, method, and TLS requirement must match.",
        "Caller-supplied Authorization or another profile-protected auth header is rejected rather than allowed to override the profile credential."
      ],
      "examples": [
        "SELECT * FROM ducknng_ncurl('http://127.0.0.1:8080/_ducknng', 'POST', '[{\"name\":\"Content-Type\",\"value\":\"application/vnd.ducknng.frame\"}]', from_hex('01000000000000000000000000000000000000000000'), 2000, 0::UBIGINT);"
      ]
