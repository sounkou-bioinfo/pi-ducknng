    {
      "name": "ducknng_register_http_route",
      "kind": "scalar",
      "category": "HTTP Routes",
      "signature": "ducknng_register_http_route(service_name, method, path, handler_sql[, request_max_bytes])",
      "returns": "BOOLEAN",
      "since": "0.1.0",
      "implemented": true,
      "description": "Register one exact-path HTTP route beside the framed RPC mount of an existing http:// or https:// service.",
      "notes": [
        "The target service must already exist and must use http:// or https://.",
        "method is normalized to uppercase; path must be an absolute path and must not include a query string or fragment.",
        "Routes may not conflict with the framed RPC mount path encoded in the service listen URL.",
        "request_max_bytes is optional and, when non-zero, must not exceed the service recv_max_bytes.",
        "This helper is rejected inside SQL authorizer callbacks and inside active request handlers."
      ],
      "examples": [
        "SELECT ducknng_register_http_route('api', 'GET', '/healthz', 'SELECT 200 AS status, ''text/plain; charset=utf-8'' AS content_type, ''ok'' AS body_text');"
      ]
    },
    {
      "name": "ducknng_register_http_route_pattern",
      "kind": "scalar",
      "category": "HTTP Routes",
      "signature": "ducknng_register_http_route_pattern(service_name, method, match_kind, path_pattern, handler_sql[, request_max_bytes])",
      "returns": "BOOLEAN",
      "since": "0.1.0",
      "implemented": true,
      "description": "Register one low-level HTTP route pattern beside the framed RPC mount using exact, prefix, or template matching.",
      "notes": [
        "match_kind must be exact, prefix, or template.",
        "Template patterns use whole-segment {name} captures and expose them later through ducknng_http_request().path_params_json.",
        "Routes may not conflict with the framed RPC mount path encoded in the service listen URL.",
        "This helper is rejected inside SQL authorizer callbacks and inside active request handlers."
      ],
      "examples": [
        "SELECT ducknng_register_http_route_pattern('api', 'GET', 'template', '/tenant/{tenant_id}/items/{item_id}', 'SELECT 200 AS status, ''text/plain; charset=utf-8'' AS content_type, ''ok'' AS body_text');"
      ]
    },
    {
