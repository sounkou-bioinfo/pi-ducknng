    {
      "name": "ducknng_set_http_route_auth",
      "kind": "scalar",
      "category": "HTTP Routes",
      "signature": "ducknng_set_http_route_auth(service_name, method, path[, require_identity[, allow_identities_json]])",
      "returns": "BOOLEAN",
      "since": "0.1.0",
      "implemented": true,
      "description": "Set authentication requirements on a registered HTTP route.",
      "notes": [
        "The three-argument form clears auth settings for the route (sets require_identity=false, allow_identities_json=NULL).",
