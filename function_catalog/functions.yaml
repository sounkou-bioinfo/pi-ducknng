      "kind": "scalar",
      "category": "HTTP Transport",
      "signature": "ducknng_register_http_profile(profile_id, scheme, host, port, path_prefix, method, tls_required, auth_header_name, auth_header_value[, expires_at_ms])",
      "returns": "BOOLEAN",
      "since": "0.1.0",
      "implemented": true,
      "description": "Register or replace an outbound HTTP credential profile with fail-closed request scope.",
