name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - "README.Rmd"
      - "README.md"
      - "docs/**"
      - "tools/site-*"
      - "tools/site.css"
      - "scripts/build_docs_site.R"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ducknng-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish curated docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install site renderer
        run: Rscript -e 'install.packages("litedown")'

      # Invoked directly rather than through `make site`: the top-level Makefile
      # includes extension-ci-tools/makefiles/c_api_extensions/c_cpp.Makefile,
      # so `make` anything would need that submodule checked out. Rendering
      # markdown has no use for the C build toolchain.
      - name: Build curated documentation site
        run: Rscript scripts/build_docs_site.R

      # Publishes to the gh-pages root. keep_files preserves the wasm/ subtree
      # that ducknng-wasm-pages.yml owns; without it this publish would delete
      # the demo. Removed doc pages therefore need a manual gh-pages cleanup.
      - name: Publish gh-pages root
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          keep_files: true
          commit_message: Deploy ducknng documentation site for ${{ github.sha }}
